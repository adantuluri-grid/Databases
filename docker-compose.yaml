version: "3.9"

services:
  postgres:
    image: postgres:18
    container_name: QueryWithSQL
    environment:
      POSTGRES_DB: citizenship
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
      - ./db/data:/data

volumes:
      postgres_data: